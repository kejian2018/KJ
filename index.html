<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Your File</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-gray-700">
        <!-- File Icon -->
        <div class="text-blue-500 text-6xl mb-4">
            <i class="fa-solid fa-file-arrow-down"></i>
        </div>

        <!-- Title & Description -->
        <h1 class="text-2xl font-bold mb-2">Ready to Download</h1>
        <p class="text-gray-400 text-sm mb-6">Click the button below to download your requested file securely.</p>

        <!-- File Info Box -->
        <div class="bg-gray-900 p-4 rounded-xl mb-6 flex items-center justify-between text-left border border-gray-800">
            <div>
                <p class="font-semibold text-sm text-gray-200" id="file-name">sample-document.pdf</p>
                <p class="text-xs text-gray-500" id="file-size">PDF • 2.4 MB</p>
            </div>
            <span class="bg-blue-500/10 text-blue-400 text-xs px-2.5 py-1 rounded-full font-medium">Ready</span>
        </div>

        <!-- Download Button -->
        <a id="download-btn" href="access.png" download="access.png" 
           class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 flex items-center justify-center space-x-2 shadow-lg shadow-blue-600/30">
            <i class="fa-solid fa-download"></i>
            <span>Download Now</span>
        </a>

        <!-- Optional Status Message -->
        <p id="status-msg" class="text-xs text-gray-500 mt-4 hidden">Your download should begin automatically.</p>
    </div>

    <!-- JavaScript for interactivity -->
    <script>
        const downloadBtn = document.getElementById('download-btn');
        const statusMsg = document.getElementById('status-msg');

        downloadBtn.addEventListener('click', function(e) {
            // Optional: If you want to simulate a delay or message when clicked
            statusMsg.classList.remove('hidden');
            
            // Note: Replace "your-file-path.pdf" with the actual path or URL of your file.
            // If the file path is a placeholder, you can prevent default behavior like this:
            // e.preventDefault();
            // alert("Please link a real file to the download button!");
        });
    </script>
</body>
</html>
